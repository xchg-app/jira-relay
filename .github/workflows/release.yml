name: release

# A release tag in this repository is the only source of a package release: it rebuilds each
# harness package and overwrites its own repository, so both packages always carry the same version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version to publish, without the leading v'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude-code, codex]
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - name: the manifests and the client agree with the tag
        run: |
          set -eu
          grep -q "^VERSION = '${{ steps.v.outputs.version }}'" client/bin/jira || { echo "client/bin/jira VERSION differs from the tag"; exit 1; }
          grep -q "^__version__ = '${{ steps.v.outputs.version }}'" jira_relay/__init__.py || { echo "jira_relay version differs from the tag"; exit 1; }
          for m in harness/claude-code/.claude-plugin/plugin.json harness/codex/.codex-plugin/plugin.json; do
            v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$m" | head -1)
            [ "$v" = "${{ steps.v.outputs.version }}" ] || { echo "$m says $v, the tag says ${{ steps.v.outputs.version }}"; exit 1; }
          done
      - name: publish ${{ matrix.harness }}
        env:
          PACKAGE_REPO: https://x-access-token:${{ secrets.PACKAGE_REPOS_TOKEN }}@github.com/${{ github.repository_owner }}/jira-relay-${{ matrix.harness }}.git
          GIT_AUTHOR_NAME: jira-relay release
          GIT_AUTHOR_EMAIL: noreply@github.com
        run: tools/publish.sh "${{ matrix.harness }}" "${{ steps.v.outputs.version }}"

  # The changelog is the body of the annotated tag (everything after its first line): the GitHub
  changelog:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: release with the tag's changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          tag="v${VERSION#v}"
          git fetch -q --force origin "refs/tags/$tag:refs/tags/$tag"   # checkout leaves a lightweight copy
          git tag -l --format='%(contents:body)' "$tag" > notes.md
          [ -s notes.md ] || { echo "::error::tag $tag has no changelog: git tag -a $tag with a body"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then gh release edit "$tag" --notes-file notes.md
          else gh release create "$tag" --title "jira-relay ${VERSION#v}" --notes-file notes.md --verify-tag; fi
